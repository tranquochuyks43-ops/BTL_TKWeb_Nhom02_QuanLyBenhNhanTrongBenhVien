<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập / Đăng ký</title>
  <link rel="stylesheet" href="css/style.css">  
  <link rel="stylesheet" href="css/dang-ky.css">      
</head>
<body>

  <div class="sidebar">
    <div class="logo-wrap">
      <div class="logo-circle"><img src="images\logo_UTC.webp" alt="Logo" onerror="this.style.display='none'"><span>LOGO</span></div>
      <h2 class="logo">Bệnh Viện UTC</h2>
    </div>
    <a href="trang-chu.html">Trang chủ</a>
    <a href="benh-nhan.html">Bệnh nhân</a>
    <a href="bac-si.html">Bác sĩ</a>
    <a href="ke-don.html">Kê Đơn</a>
    <a href="dang-ky.html">Đăng nhập / Đăng ký</a>
  </div>

  <div class="main">
    <div class="header">
      <button id="toggleBtn">&#9776;</button>
      <h3>Đăng nhập / Đăng ký</h3>
      <span id="clock"></span>
    </div>
    <!-- ẢNH NỀN:  -->
    <div class="content dk-content">
      <div class="box dk-box">
        <div class="dk-tabs">
          <button class="dk-tab active" id="tabLogin">Đăng nhập</button>
          <button class="dk-tab" id="tabReg">Đăng ký</button>
        </div>
        <!--  đăng nhập -->
        <div id="formLogin">
          <input type="text" id="lgUser" placeholder="Nhập tên đăng nhập"><br><br>
          <input type="password" id="lgPass" placeholder="Nhập mật khẩu"><br><br>
          <button class="btn" id="btnLogin">Đăng nhập</button>
          <p class="msg error" id="lgMsg"></p>
          <p><small>Tài khoản thử: admin / 123456</small></p>
        </div>
        <!--  đăng ký -->
        <div id="formReg" style="display:none">
          <input type="text" id="rgName" placeholder="Họ tên"><br><br>
          <input type="text" id="rgPhone" placeholder="Số điện thoại"><br><br>
          <input type="email" id="rgEmail" placeholder="Email"><br><br>
          <input type="text" id="rgAddress" placeholder="Địa chỉ"><br><br>
          <input type="text" id="rgUser" placeholder="Tên đăng nhập"><br><br>
          <input type="password" id="rgPass" placeholder="Mật khẩu (ít nhất 6 ký tự)"><br><br>
          <input type="password" id="rgPass2" placeholder="Nhập lại mật khẩu"><br><br>
          <button class="btn" id="btnReg">Đăng ký</button>
          <p class="msg error" id="rgMsg"></p>
        </div>
      </div>
    </div>

    <div class="footer">&#169; benhvienutcvn.gmail.com </div>
  </div>

  <script src="js/script.js"></script>   
  <script src="js/dang-ky.js"></script>      
</body>
</html>
